# Jet Core Service Bus — docker-compose
# Phase 1, Step A6 (Design.md §11 Track A); adapters added in Phase 2,
# Design.md §12 Step E1 — the Webhook Listener -> File Storage Adapter
# vertical slice.
#
# IMPORTANT — run order, not automated by this file:
#   1. infra/nats/bootstrap_auth.sh   (Step A3 — generates resolver.conf and
#      the .creds files this service's config depends on; must exist BEFORE
#      `nats` can start, since nats-server.conf `include`s it)
#   2. docker compose up -d nats
#   3. infra/nats/bootstrap_jetstream.sh   (Step A5 — needs a running,
#      authenticated server to create the EVENTS stream + service-directory
#      KV bucket against)
#   4. docker compose up -d webhook-listener file-storage-adapter
# infra/nats/up.sh runs 1-3 in order. See infra/nats/README.md for why
# this isn't wired into Compose's own dependency graph (`depends_on` +
# service_completed_successfully/service_healthy): both bootstrap scripts
# already shell out to `docker run` themselves (Design.md §11's "no native
# install" decision — nsc/nats CLI/yq all run containerized); running them
# as Compose services too would mean Docker-outside-of-Docker (mounting the
# host's docker.sock into a container just to spawn sibling containers),
# which is real added fragility for scripts that already work well as
# host-level tooling. Revisit if that tradeoff stops being worth it.
#
# Both adapters' `depends_on: nats` controls start ORDER only, not
# readiness (the same A6 finding: nats:2.14.5 has no shell, so no
# Compose-native healthcheck exists to depend on with `condition:
# service_healthy`) — `restart: unless-stopped` is what actually covers
# "NATS wasn't ready yet when this adapter's own nats.connect() ran",
# the same policy nats itself uses. Neither adapter has its own
# connection-retry logic (Design.md §12, a deliberate v1 scoping choice,
# not an oversight) — Compose restarting a crashed container until it
# succeeds is the chosen mechanism instead.

name: jetcore   # fixes the Compose project/network name (jetcore_default) regardless
            # of the checkout directory's name — infra/nats/up.sh depends on it

services:
  nats:
    image: nats:2.14.5
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring (/varz, /healthz, ...)
    volumes:
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./infra/nats/resolver.conf:/etc/nats/resolver.conf:ro
      - nats-data:/data/jetstream
    restart: unless-stopped

  webhook-listener:
    build:
      context: .
      dockerfile: adapters/webhook_listener/Dockerfile
    depends_on:
      - nats
    ports:
      - "8080:8080"
    environment:
      JETCORE_SERVICE_ID: webhook-listener-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/webhook-listener-01.creds
      # Dev-only placeholder (Decision #21 — a generic shared-secret
      # mechanism, no real webhook source integrated yet). Real
      # deployments must override this; it is deliberately not "secret"
      # as checked into this file.
      JETCORE_WEBHOOK_SECRET: dev-only-change-me
      JETCORE_HTTP_PORT: "8080"
    volumes:
      - ./infra/nats/operator/creds/webhook-listener-01.creds:/creds/webhook-listener-01.creds:ro
    restart: unless-stopped

  file-storage-adapter:
    build:
      context: .
      dockerfile: adapters/file_storage_adapter/Dockerfile
    depends_on:
      - nats
    environment:
      JETCORE_SERVICE_ID: file-storage-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/file-storage-01.creds
      JETCORE_WATCH_DIR: /data
    volumes:
      - ./infra/nats/operator/creds/file-storage-01.creds:/creds/file-storage-01.creds:ro
      - ./infra/files:/data
    restart: unless-stopped

  # Design.md §13 Step J1 — binlog enabled via the my.cnf mount
  # (log_bin/binlog_format=ROW/server-id, required for the Database
  # Adapter's CDC read path, Decision #15); init.sql creates the demo
  # `orders` table plus the two distinct least-privilege users (Decision
  # #25/Track J parameter table) on first start against a fresh
  # `mysql-data` volume.
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: dev-only-change-me
      MYSQL_DATABASE: jetcore
    ports:
      - "3306:3306"   # dev convenience (e.g. K3's direct-SQL-write smoke
                       # test) — not needed by any adapter, which all
                       # connect via the `mysql` Compose network alias.
    volumes:
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/jetcore.cnf:ro
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  # Design.md §13 Step K2 — the four remaining adapters, each's real
  # `.creds` file mounted the same way as webhook-listener/file-storage
  # already are. Target URLs are deliberately in-network, always-available
  # placeholders (Decision #14 — no real external bounded context/API is
  # integrated yet): pointing outbound-calling adapters at a real external
  # host would either need internet access this dev stack shouldn't
  # depend on, or would just fail forever with nothing to observe. Each
  # choice here still exercises the adapter's real HTTP behavior end to
  # end, not a no-op.

  webhook-sender:
    build:
      context: .
      dockerfile: adapters/webhook_sender/Dockerfile
    depends_on:
      - nats
    environment:
      JETCORE_SERVICE_ID: webhook-sender-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/webhook-sender-01.creds
      JETCORE_SUBJECTS: events.orders.OrderCreated
      # Relays each OrderCreated to the Webhook Listener's own real HTTP
      # surface — a genuine, self-contained round trip through a second
      # real adapter (OrderCreated -> relayed as a webhook -> converted
      # into FileWriteRequested -> written to disk by the File Storage
      # Adapter), not a target that only ever errors.
      JETCORE_TARGET_URL: http://webhook-listener:8080/webhooks/orders/relayed.json
      JETCORE_OUTBOUND_SECRET: dev-only-change-me   # must match webhook-listener's JETCORE_WEBHOOK_SECRET below
    volumes:
      - ./infra/nats/operator/creds/webhook-sender-01.creds:/creds/webhook-sender-01.creds:ro
    restart: unless-stopped

  http-adapter:
    build:
      context: .
      dockerfile: adapters/http_adapter/Dockerfile
    depends_on:
      - nats
    environment:
      JETCORE_SERVICE_ID: http-adapter-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/http-adapter-01.creds
      JETCORE_SUBJECTS: events.orders.OrderCreated
      # /healthz only accepts GET, so this POST always gets a real (405)
      # response — still a real HTTP round trip proving the adapter's
      # actual behavior ("report the outcome, don't judge it"), without
      # depending on anything outside this stack or ever needing a nak/
      # redelivery retry loop against an unreachable host.
      JETCORE_TARGET_BASE_URL: http://webhook-listener:8080/healthz
    volumes:
      - ./infra/nats/operator/creds/http-adapter-01.creds:/creds/http-adapter-01.creds:ro
    restart: unless-stopped

  rest-api-service:
    build:
      context: .
      dockerfile: adapters/rest_api_service/Dockerfile
    depends_on:
      - nats
    ports:
      - "8081:8080"   # 8081 on the host — webhook-listener already owns 8080
    environment:
      JETCORE_SERVICE_ID: rest-api-service-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/rest-api-service-01.creds
      JETCORE_HTTP_PORT: "8080"
    volumes:
      - ./infra/nats/operator/creds/rest-api-service-01.creds:/creds/rest-api-service-01.creds:ro
    restart: unless-stopped

  db-adapter-mysql:
    build:
      context: .
      dockerfile: adapters/db_adapter_mysql/Dockerfile
    depends_on:
      - nats
      - mysql
    environment:
      JETCORE_SERVICE_ID: db-adapter-mysql-01
      JETCORE_NATS_URL: nats://nats:4222
      JETCORE_NATS_CREDS_PATH: /creds/db-adapter-mysql-01.creds
      JETCORE_MYSQL_HOST: mysql
      JETCORE_MYSQL_WRITE_USER: jetcore_write
      JETCORE_MYSQL_WRITE_PASSWORD: jetcore-write-dev-only
      JETCORE_MYSQL_CDC_USER: jetcore_cdc
      JETCORE_MYSQL_CDC_PASSWORD: jetcore-cdc-dev-only
    volumes:
      - ./infra/nats/operator/creds/db-adapter-mysql-01.creds:/creds/db-adapter-mysql-01.creds:ro
    restart: unless-stopped

volumes:
  nats-data:
  mysql-data:
