# Step B1 (Design.md §7.4, §11 Track B). Hooks shell out to `uv run` rather
# than letting pre-commit provision its own per-hook environments — reuses
# the project's one uv-managed venv instead of duplicating it.
#
# This file is checked in but hooks are NOT auto-installed into .git/hooks —
# that's a per-developer choice. Run `uv run pre-commit install` to enable
# them locally.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # adapters/ (Step C1) and tests/ (Step E4, cross-adapter tests)
        # added here as each came into existence. Still explicit paths,
        # not a bare `mypy`: it hard-errors on a missing path argument
        # rather than skipping it (confirmed by testing, unlike pytest's
        # tolerant `testpaths`), so this needs updating again if any of
        # these are ever removed.
        entry: uv run --all-packages mypy libs adapters tests
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -q -r
        language: system
        types: [python]
        # Design.md §14 Step L5 — a real, confirmed regex gap, not a
        # style tweak: `^.*/tests/` requires a path segment *before*
        # "tests/", so it excluded adapters/*/tests/ and libs/jetcore/
        # tests/ correctly but never matched a *bare* leading "tests/"
        # (this project's own root-level cross-adapter test directory,
        # Step E4) — that one's assert-heavy test files were slipping
        # through into every bandit run undetected until this was found.
        # `(^|.*/)tests/` matches both shapes.
        exclude: (^|.*/)tests/
