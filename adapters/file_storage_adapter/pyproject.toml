# file_storage_adapter — command-driven file operations service (Design.md
# §8, §12 Step C1). First real adapter package in the workspace.
#
# Dependencies added incrementally as each module (Design.md §12 Track C) is
# actually built, same discipline Track B followed: aiofiles lands with C4
# (the write-path handler), watchfiles with C5 (external-creation watch).
# `jetcore` is the one dependency every adapter needs from the start.

[project]
name = "file-storage-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "jetcore",
    "watchfiles>=1.2.0",
]

[tool.uv.sources]
jetcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["file_storage_adapter"]
