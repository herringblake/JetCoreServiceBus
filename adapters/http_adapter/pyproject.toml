# http_adapter — calls a configured external REST API when triggered by a
# bus event, publishes the response back as a correlated event (Design.md
# §8, §13 Track H).
#
# Dependencies added incrementally as each module (Design.md §13 Track H)
# is actually built, same discipline every prior adapter followed.
# `jetcore` is the one dependency every adapter needs from the start.
#
# [project] name is "jetcore-http-adapter", not "http-adapter" — the
# latter is a real, unrelated package already published on PyPI
# (confirmed during Design.md §13 Step G5, which found the same problem
# for webhook-listener/webhook-sender). Decision #28: every adapter's
# distribution name gets this prefix from now on; the Python import name
# (`http_adapter`) is unaffected.

[project]
name = "jetcore-http-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jetcore",
]

[tool.uv.sources]
jetcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["http_adapter"]
