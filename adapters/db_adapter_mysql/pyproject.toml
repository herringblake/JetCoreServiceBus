# db_adapter_mysql — bidirectional Database Adapter (Design.md §8, §13
# Track J, Decision #10). Write path persists bus events to MySQL; CDC
# read path tails the binlog and publishes row changes.
#
# Dependencies added incrementally as each module (Design.md §13 Track J)
# is actually built, same discipline every prior adapter followed.
# `jetcore` is the one dependency every adapter needs from the start;
# SQLAlchemy/asyncmy (write path, Step J4) and python-mysql-replication
# (CDC read path, Step J5) land as those steps are actually built.
#
# [project] name is "jetcore-db-adapter-mysql", not "db-adapter-mysql" —
# Decision #28 applied from the start (matching Steps H1/I2's precedent),
# not retrofitted.

[project]
name = "jetcore-db-adapter-mysql"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.14",
    "cryptography>=50.0.1",
    "jetcore",
    "mysql-replication>=1.0.17",
    "sqlalchemy[asyncio]>=2.0.52",
]

[tool.uv.sources]
jetcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_adapter_mysql"]
