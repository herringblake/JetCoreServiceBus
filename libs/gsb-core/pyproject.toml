# gsb-core — shared library used by every adapter (Design.md §7.1)
#
# Step B1 scaffold only: package structure + tooling wiring, no runtime
# dependencies yet. pydantic/pyrage/nats-py/etc. get added in B2–B6 as each
# module (envelope, crypto, bus_client, registry, config) is actually built.

[project]
name = "gsb-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gsb_core"]
