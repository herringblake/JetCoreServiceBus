# jetcore — shared library used by every adapter (Design.md §7.1)
#
# Dependencies added incrementally as each module (Design.md §11 Track B) is
# actually built: pydantic + uuid6 land in B2 (envelope.py). pyrage/nkeys
# (B3), nats-py (B5/B6) etc. still pending.

[project]
name = "jetcore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py[nkeys]>=2.15.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyrage>=1.4.0",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jetcore"]
